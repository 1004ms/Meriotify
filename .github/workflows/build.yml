name: Build

on:
  pull_request:
    branches:
      - "main"
      - "*/main/*/**"
  push:
    branches:
      - "main"
      - "*/main/*/**"
  release:
    types: [published]

env:
  UPSTREAM_COMPAT_VERSION: "2.45.1"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate wrapper build
        run: pnpm check:wrapper

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"

      - name: Build
        run: go build -trimpath -buildvcs=false -ldflags "-s -w -X main.upstreamVersion=${{ env.UPSTREAM_COMPAT_VERSION }}" .

      - name: Validate PowerShell installers
        shell: pwsh
        run: |
          foreach ($file in @('./install.ps1', './uninstall.ps1')) {
            [void][scriptblock]::Create((Get-Content -Raw $file))
            $bytes = [IO.File]::ReadAllBytes($file)
            if ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF) {
              throw "$file must be UTF-8 without BOM"
            }
          }

      - name: Format
        run: |
          gofmt -s -l .
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then exit 1; fi

  release:
    permissions:
      id-token: write
      contents: write
      attestations: write
    name: Release
    strategy:
      matrix:
        os: ["linux", "darwin", "windows"]
        arch: ["amd64", "arm64", "386"]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    env:
      SIGNPATH_ENABLED: ${{ secrets.SIGNPATH_API_TOKEN != '' && secrets.SIGNPATH_ORG_ID != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Get Tag
        run: echo "TAG=${GITHUB_REF#refs/*/v}" >> $GITHUB_ENV

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Build wrapper bundle
        run: pnpm build:wrapper

      - name: Is Unix Platform
        run: echo "IS_UNIX=${{ matrix.os != 'windows' && matrix.arch != '386' && (matrix.os != 'linux' || matrix.arch != 'arm64') }}" >> $GITHUB_ENV

      - name: Is Windows Platform
        run: echo "IS_WIN=${{ matrix.os == 'windows' }}" >> $GITHUB_ENV

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"

      - name: Build
        if: env.IS_UNIX == 'true' || env.IS_WIN == 'true'
        run: |
          go build -trimpath -buildvcs=false -ldflags "-s -w -X main.version=${{ env.TAG }} -X main.upstreamVersion=${{ env.UPSTREAM_COMPAT_VERSION }}" -o "./meriotify${{ matrix.os == 'windows' && '.exe' || '' }}"
          chmod +x "./meriotify${{ matrix.os == 'windows' && '.exe' || '' }}"
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0

      - name: Upload Artifact for Signing
        if: env.IS_WIN == 'true' && env.SIGNPATH_ENABLED == 'true'
        id: upload-artifact-for-signing
        uses: actions/upload-artifact@v7
        with:
          name: meriotify-${{ env.TAG }}-${{ matrix.os }}-${{ (matrix.arch == 'amd64' && 'x64') || (matrix.arch == 'arm64' && 'arm64') || 'x32' }}-unsigned
          path: ./meriotify.exe

      - name: Sign Windows Executable
        if: env.IS_WIN == 'true' && env.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORG_ID }}
          project-slug: "cli"
          signing-policy-slug: "release-signing"
          github-artifact-id: ${{ steps.upload-artifact-for-signing.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: "./signed"

      - name: Copy Signed Windows Executable
        if: env.IS_WIN == 'true' && env.SIGNPATH_ENABLED == 'true'
        run: |
          cp ./signed/meriotify.exe ./meriotify.exe

      - name: Attest output
        uses: actions/attest-build-provenance@v4
        if: env.IS_UNIX == 'true' || env.IS_WIN == 'true'
        with:
          subject-path: "./meriotify${{ matrix.os == 'windows' && '.exe' || '' }}"
          subject-name: "Meriotify v${{ env.TAG }} (${{ matrix.os }}, ${{ (matrix.os == 'windows' && matrix.arch == 'amd64' && 'x64') || (matrix.os == 'windows' && matrix.arch == '386' && 'x32') || matrix.arch }})"

      - name: 7z - .tar
        if: env.IS_UNIX == 'true'
        uses: edgarrc/action-7z@v1
        with:
          args: 7z a -bb0 "meriotify-${{ env.TAG }}-${{ matrix.os }}-${{ matrix.arch }}.tar" "./meriotify" "./CustomApps" "./Extensions" "./Themes" "./MarketplaceBranding" "./jsHelper" "globals.d.ts" "css-map.json"

      - name: 7z - .tar.gz
        if: env.IS_UNIX == 'true'
        uses: edgarrc/action-7z@v1
        with:
          args: 7z a -bb0 -sdel -mx9 "meriotify-${{ env.TAG }}-${{ matrix.os }}-${{ matrix.arch }}.tar.gz" "meriotify-${{ env.TAG }}-${{ matrix.os }}-${{ matrix.arch }}.tar"

      - name: 7z - .zip
        if: env.IS_WIN == 'true'
        uses: edgarrc/action-7z@v1
        with:
          args: 7z a -bb0 -mx9 "meriotify-${{ env.TAG }}-${{ matrix.os }}-${{ (matrix.arch == 'amd64' && 'x64') || (matrix.arch == 'arm64' && 'arm64') || 'x32' }}.zip" "./meriotify.exe" "./spicetify.cmd" "./CustomApps" "./Extensions" "./Themes" "./MarketplaceBranding" "./jsHelper" "globals.d.ts" "css-map.json"

      - name: Release
        if: env.IS_UNIX == 'true' || env.IS_WIN == 'true'
        uses: softprops/action-gh-release@v3
        with:
          files: "meriotify-${{ env.TAG }}-${{ matrix.os }}-${{ (matrix.os == 'windows' && matrix.arch == 'amd64' && 'x64') || (matrix.os == 'windows' && matrix.arch == '386' && 'x32') || matrix.arch }}.${{ matrix.os == 'windows' && 'zip' || 'tar.gz' }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-scripts:
    permissions:
      contents: write
    name: Publish installers
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Attach installer scripts
        uses: softprops/action-gh-release@v3
        with:
          files: |
            install.ps1
            uninstall.ps1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

